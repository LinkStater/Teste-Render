<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="manifest" href="/manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu App na Nuvem</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1b4b, #312e81);
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            text-align: center;
            max-width: 400px;
        }
        h1 { margin-bottom: 0.5rem; color: #818cf8; }
        p { color: #cbd5e1; font-size: 0.95rem; }
        .badge {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.4rem 1rem;
            background: #22c55e;
            color: white;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Olá, Mundo! 🚀</h1>
        <p>Seu aplicativo Node.js com HTML estático está rodando perfeitamente na nuvem.</p>
        <div class="badge">Online no Render</div>
    </div>
</body>
</html>
